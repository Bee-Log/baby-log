<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_NAME__ (offline)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="test-banner" class="test-banner" hidden>TEST version. Data here is kept apart from the real app.</div>
  <main>
    <h1>You are offline</h1>
    <p class="lead">This page could not load without internet.</p>
    <p class="status">Your saved entries stay on this phone. Try again when you are back online.</p>
  </main>
  <script>
    if (self.BABYLOG_CONFIG.env === 'test') {
      document.getElementById('test-banner').hidden = false;
      document.body.classList.add('is-test');
    }
  </script>
</body>
</html>
