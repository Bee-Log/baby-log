<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>__APP_NAME__</title>
  <meta name="theme-color" content="__THEME_COLOR__">
  <meta name="app-version" content="__APP_VERSION__">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/__ICON_PREFIX__icon-192.png">
  <link rel="apple-touch-icon" href="icons/__ICON_PREFIX__icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="records.js"></script>
  <script src="store.js"></script>
</head>
<body>
  <div id="test-banner" class="test-banner" hidden>TEST version. Data here is kept apart from the real app.</div>

  <main>
    <section class="view" id="view-today" data-tab="today" aria-labelledby="h-today">
      <div class="quick">
        <button type="button" class="quick-btn" data-log="pee">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"></path></svg>
          Wee
        </button>
        <button type="button" class="quick-btn" data-log="poop">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"></circle><path d="M9 13h6"></path></svg>
          Poo
        </button>
      </div>
      <h1 id="h-today" class="list-title">Today</h1>
      <ol class="timeline" id="today-list"></ol>
      <p class="empty" id="today-empty" hidden>Nothing logged yet today.</p>
    </section>
    <section class="view" id="view-summary" data-tab="summary" aria-labelledby="h-summary" hidden>
      <h1 id="h-summary">Summary</h1>
      <p class="lead">Daily totals will show here.</p>
    </section>
    <section class="view" id="view-growth" data-tab="growth" aria-labelledby="h-growth" hidden>
      <h1 id="h-growth">Growth</h1>
      <p class="lead">Weight and length will show here.</p>
    </section>
    <p class="status"><span id="status">Checking offline support…</span> <span id="version"></span></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Today
    </a>
    <a href="#summary" data-tab="summary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 15v-3M12 15V9M16 15v-5"></path></svg>
      Summary
    </a>
    <a href="#growth" data-tab="growth">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"></path><path d="M15 7h5v5"></path></svg>
      Growth
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
